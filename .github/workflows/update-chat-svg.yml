name: Update chat SVG

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Only one run at a time, so two runs never push over each other
concurrency:
  group: update-chat-svg
  cancel-in-progress: false

jobs:
  update-svg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build chat.svg
        run: node build-svg.js

      - name: Set current date in Bangkok time
        run: echo "DATE=$(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Commit updated chat.svg
        run: |
          git config user.name "Korng Samnang"
          git config user.email "${{ secrets.MY_GITHUB_EMAIL }}"
          git add chat.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update chat.svg - $DATE" --date="$(TZ=Asia/Bangkok date)"
          git pull --rebase origin master
          git push
